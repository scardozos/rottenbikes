apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  labels:
    app: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ui
      containers:
      - name: ui
        image: ui
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 30
          periodSeconds: 5
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: rottenbikes-config
              key: PORT
        - name: EXPO_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: rottenbikes-config
              key: EXPO_PUBLIC_API_URL
        - name: EXPO_PUBLIC_HCAPTCHA_SITEKEY
          valueFrom:
            configMapKeyRef:
              name: rottenbikes-config
              key: EXPO_PUBLIC_HCAPTCHA_SITEKEY
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
